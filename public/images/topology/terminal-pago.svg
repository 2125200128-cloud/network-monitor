<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Terminal de pago (TPV / pinpad) del kiosco: pantalla, teclado y ranura de tarjeta -->
  <defs>
    <linearGradient id="tCuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset=".55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tPant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f7"/>
      <stop offset="1" stop-color="#7cc3ea"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="186" rx="40" ry="7" fill="#0f172a" opacity=".18"/>
  <!-- tarjeta insertada -->
  <rect x="78" y="150" width="44" height="30" rx="4" fill="#3b82f6"/>
  <rect x="84" y="158" width="10" height="8" rx="1.5" fill="#fbbf24"/>
  <!-- cuerpo -->
  <path d="M64 30 Q64 16 78 16 H122 Q136 16 136 30 V160 Q136 172 124 172 H76 Q64 172 64 160 Z" fill="url(#tCuerpo)" stroke="#0b1320" stroke-width="2"/>
  <!-- pantalla -->
  <rect x="74" y="28" width="52" height="40" rx="4" fill="url(#tPant)" stroke="#0b1320" stroke-width="1.5"/>
  <rect x="80" y="36" width="30" height="5" rx="2" fill="#1e3a5f" opacity=".75"/>
  <rect x="80" y="46" width="40" height="8" rx="2" fill="#1e3a5f" opacity=".9"/>
  <rect x="80" y="58" width="18" height="4" rx="2" fill="#1e3a5f" opacity=".5"/>
  <!-- teclado -->
  <g fill="#e2e8f0">
    <rect x="76" y="78" width="14" height="10" rx="2"/><rect x="93" y="78" width="14" height="10" rx="2"/><rect x="110" y="78" width="14" height="10" rx="2"/>
    <rect x="76" y="92" width="14" height="10" rx="2"/><rect x="93" y="92" width="14" height="10" rx="2"/><rect x="110" y="92" width="14" height="10" rx="2"/>
    <rect x="76" y="106" width="14" height="10" rx="2"/><rect x="93" y="106" width="14" height="10" rx="2"/><rect x="110" y="106" width="14" height="10" rx="2"/>
    <rect x="93" y="120" width="14" height="10" rx="2"/>
  </g>
  <rect x="76" y="120" width="14" height="10" rx="2" fill="#ef4444"/>
  <rect x="110" y="120" width="14" height="10" rx="2" fill="#22c55e"/>
  <rect x="80" y="140" width="40" height="5" rx="2.5" fill="#020617"/>
</svg>

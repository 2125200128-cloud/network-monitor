<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Inner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Drop Shadow & Outer Plate -->
  <g filter="url(#dropShadow)">
    <!-- Shield Outer Frame -->
    <path d="M 100,15 L 175,45 C 175,120 135,168 100,185 C 65,168 25,120 25,45 Z" 
          fill="url(#rimGrad)" 
          stroke="#1e293b" 
          stroke-width="3" />

    <!-- Shield Inner Core -->
    <path d="M 100,23 L 167,50 C 167,115 130,158 100,174 C 70,158 33,115 33,50 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- Firewall Brick Grid Pattern -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="2" fill="none">
    <!-- Row 1 -->
    <line x1="50" y1="65" x2="150" y2="65" />
    <!-- Row 2 -->
    <line x1="42" y1="90" x2="158" y2="90" />
    <!-- Row 3 -->
    <line x1="48" y1="115" x2="152" y2="115" />
    <!-- Row 4 -->
    <line x1="60" y1="140" x2="140" y2="140" />

    <!-- Vertical Bricks Row 1 -->
    <line x1="75" y1="65" x2="75" y2="90" />
    <line x1="125" y1="65" x2="125" y2="90" />

    <!-- Vertical Bricks Row 2 -->
    <line x1="100" y1="90" x2="100" y2="115" />
    <line x1="55" y1="90" x2="55" y2="115" />
    <line x1="145" y1="90" x2="145" y2="115" />

    <!-- Vertical Bricks Row 3 -->
    <line x1="80" y1="115" x2="80" y2="140" />
    <line x1="120" y1="115" x2="120" y2="140" />
  </g>

  <!-- Central Fortinet Security Lock / Flame Core -->
  <g filter="url(#glow)">
    <!-- Lock Shackle / Top Arc -->
    <path d="M 80,82 A 20,20 0 0,1 120,82 V 95 H 80 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    
    <!-- Lock Body / Core Security Box -->
    <rect x="72" y="94" width="56" height="42" rx="8" fill="#ffffff" stroke="#991b1b" stroke-width="2" />
    
    <!-- Keyhole / Active Status Indicator -->
    <circle cx="100" cy="111" r="5" fill="#dc2626" />
    <polygon points="97,113 103,113 102,125 98,125" fill="#dc2626" />
  </g>

  <!-- FortiGate Red Status Pulse Ring -->
  <circle cx="100" cy="174" r="6" fill="#ef4444" />
  <circle cx="100" cy="174" r="10" fill="none" stroke="#f87171" stroke-width="2" opacity="0.8">
    <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Badge Text FORTINET -->
  <rect x="55" y="148" width="90" height="16" rx="4" fill="#0f172a" opacity="0.85" />
  <text x="100" y="160" font-family="'Inter', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">FORTINET</text>
</svg>

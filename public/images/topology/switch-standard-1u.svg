<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="260" height="48">
  <defs>
    <linearGradient id="switch1uBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rackEar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="chassisShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#chassisShadow)">
    <!-- Left Rack Ear -->
    <path d="M 4 6 L 16 6 L 16 42 L 4 42 Z" fill="url(#rackEar)" stroke="#475569" stroke-width="0.75"/>
    <circle cx="10" cy="12" r="2.3" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="10" cy="36" r="2.3" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>

    <!-- Right Rack Ear -->
    <path d="M 244 6 L 256 6 L 256 42 L 244 42 Z" fill="url(#rackEar)" stroke="#475569" stroke-width="0.75"/>
    <circle cx="250" cy="12" r="2.3" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="250" cy="36" r="2.3" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>

    <!-- 1U Standard Managed Switch Chassis -->
    <rect x="16" y="6" width="228" height="36" rx="2" fill="url(#switch1uBody)" stroke="#475569" stroke-width="1"/>
    <line x1="16" y1="7" x2="244" y2="7" stroke="#64748b" stroke-width="1"/>

    <!-- Brand / Status -->
    <rect x="22" y="11" width="8" height="6" rx="1" fill="#475569" opacity="0.9"/>
    <text x="33" y="15" font-family="ui-monospace, monospace" font-size="5" font-weight="800" fill="#f1f5f9" letter-spacing="0.5">NET</text>
    <text x="33" y="21" font-family="ui-monospace, monospace" font-size="4" font-weight="700" fill="#94a3b8">1U MANAGED SWITCH</text>

    <!-- Status LEDs -->
    <circle cx="24" cy="27" r="1.3" fill="#10b981"/>
    <circle cx="28" cy="27" r="1.3" fill="#10b981"/>
    <circle cx="32" cy="27" r="1.3" fill="#38bdf8"/>
    <circle cx="24" cy="32" r="1.3" fill="#10b981"/>
    <circle cx="28" cy="32" r="1.3" fill="#64748b"/>
    <circle cx="32" cy="32" r="1.3" fill="#10b981"/>

    <!-- 24-Port Gigabit RJ45 Stack (Ports 1-24) -->
    <g transform="translate(60, 12)">
      <rect x="0" y="0" width="138" height="24" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      
      <!-- 12 dual RJ45 stacks -->
      <g transform="translate(3, 2)">
        <rect x="0" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="0" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="4" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="11" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="11" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="15" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="22" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="22" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="26" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="33" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="33" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="37" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="44" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="44" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="48" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="55" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="55" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="59" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="66" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="66" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="70" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="77" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="77" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="81" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="88" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="88" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="92" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="99" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="99" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="103" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="110" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="110" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="114" cy="-1" r="0.7" fill="#10b981"/>

        <rect x="121" y="0" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <rect x="121" y="12" width="8" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
        <circle cx="125" cy="-1" r="0.7" fill="#10b981"/>
      </g>
    </g>

    <!-- 4x SFP Uplink Cages (Right) -->
    <g transform="translate(204, 12)">
      <rect x="0" y="0" width="32" height="24" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <rect x="3" y="3" width="11" height="8" rx="0.5" fill="#1e293b" stroke="#64748b" stroke-width="0.6"/>
      <rect x="17" y="3" width="11" height="8" rx="0.5" fill="#1e293b" stroke="#64748b" stroke-width="0.6"/>
      <rect x="3" y="13" width="11" height="8" rx="0.5" fill="#1e293b" stroke="#64748b" stroke-width="0.6"/>
      <rect x="17" y="13" width="11" height="8" rx="0.5" fill="#1e293b" stroke="#64748b" stroke-width="0.6"/>
      <circle cx="8" cy="1" r="0.8" fill="#38bdf8"/>
      <circle cx="22" cy="1" r="0.8" fill="#38bdf8"/>
    </g>
  </g>
</svg>

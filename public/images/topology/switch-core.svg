<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <defs>
    <linearGradient id="c9300Body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rackEar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="sfpCage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="chassisShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#chassisShadow)">
    <!-- Left Rack Ear -->
    <path d="M 4 8 L 16 8 L 16 44 L 4 44 Z" fill="url(#rackEar)" stroke="#475569" stroke-width="0.75"/>
    <circle cx="10" cy="14" r="2.5" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="10" cy="38" r="2.5" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>

    <!-- Right Rack Ear -->
    <path d="M 244 8 L 256 8 L 256 44 L 244 44 Z" fill="url(#rackEar)" stroke="#475569" stroke-width="0.75"/>
    <circle cx="250" cy="14" r="2.5" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="250" cy="38" r="2.5" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>

    <!-- 1U Main Chassis -->
    <rect x="16" y="8" width="228" height="36" rx="2" fill="url(#c9300Body)" stroke="#475569" stroke-width="1"/>
    <!-- Top chassis bezel line -->
    <line x1="16" y1="9" x2="244" y2="9" stroke="#64748b" stroke-width="1"/>

    <!-- Left Brand & Status Cluster -->
    <rect x="22" y="13" width="10" height="7" rx="1" fill="#0284c7" opacity="0.85"/>
    <text x="35" y="18" font-family="ui-monospace, monospace" font-size="5" font-weight="900" fill="#cbd5e1" letter-spacing="0.5">CISCO</text>
    <text x="35" y="24" font-family="ui-monospace, monospace" font-size="4" font-weight="700" fill="#94a3b8">CATALYST 9300</text>
    
    <!-- System Status Micro LEDs -->
    <circle cx="24" cy="27" r="1.2" fill="#10b981"/>
    <circle cx="28" cy="27" r="1.2" fill="#10b981"/>
    <circle cx="32" cy="27" r="1.2" fill="#10b981"/>
    <circle cx="24" cy="32" r="1.2" fill="#10b981"/>
    <circle cx="28" cy="32" r="1.2" fill="#38bdf8"/>
    <circle cx="32" cy="32" r="1.2" fill="#64748b"/>

    <!-- 24-Port Main Ethernet Block (12 upper, 12 lower) -->
    <!-- Bank 1 (Ports 1-8) -->
    <g transform="translate(68, 14)">
      <rect x="0" y="0" width="38" height="24" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <!-- Top row RJ45 jacks -->
      <rect x="3" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="12" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="21" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="30" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <!-- Port LEDs -->
      <circle cx="6" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="15" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="24" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="33" cy="1" r="0.8" fill="#10b981"/>
      <!-- Bottom row RJ45 jacks -->
      <rect x="3" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="12" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="21" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="30" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <!-- Port LEDs -->
      <circle cx="6" cy="23" r="0.8" fill="#10b981"/>
      <circle cx="15" cy="23" r="0.8" fill="#10b981"/>
      <circle cx="24" cy="23" r="0.8" fill="#64748b"/>
      <circle cx="33" cy="23" r="0.8" fill="#10b981"/>
    </g>

    <!-- Bank 2 (Ports 9-16) -->
    <g transform="translate(112, 14)">
      <rect x="0" y="0" width="38" height="24" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <!-- Top row RJ45 jacks -->
      <rect x="3" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="12" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="21" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="30" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <!-- Bottom row RJ45 jacks -->
      <rect x="3" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="12" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="21" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="30" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <!-- LEDs -->
      <circle cx="6" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="15" cy="1" r="0.8" fill="#64748b"/>
      <circle cx="24" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="33" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="6" cy="23" r="0.8" fill="#10b981"/>
      <circle cx="15" cy="23" r="0.8" fill="#10b981"/>
      <circle cx="24" cy="23" r="0.8" fill="#10b981"/>
      <circle cx="33" cy="23" r="0.8" fill="#64748b"/>
    </g>

    <!-- Bank 3 (Ports 17-24) -->
    <g transform="translate(156, 14)">
      <rect x="0" y="0" width="38" height="24" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <!-- Top row RJ45 jacks -->
      <rect x="3" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="12" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="21" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="30" y="2" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <!-- Bottom row RJ45 jacks -->
      <rect x="3" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="12" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="21" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <rect x="30" y="14" width="6" height="8" rx="0.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
      <!-- LEDs -->
      <circle cx="6" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="15" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="24" cy="1" r="0.8" fill="#64748b"/>
      <circle cx="33" cy="1" r="0.8" fill="#10b981"/>
      <circle cx="6" cy="23" r="0.8" fill="#64748b"/>
      <circle cx="15" cy="23" r="0.8" fill="#10b981"/>
      <circle cx="24" cy="23" r="0.8" fill="#10b981"/>
      <circle cx="33" cy="23" r="0.8" fill="#10b981"/>
    </g>

    <!-- SFP+ Uplink Modular Bay (Right) -->
    <g transform="translate(202, 14)">
      <rect x="0" y="0" width="34" height="24" rx="1.5" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
      <!-- SFP 1 & 2 -->
      <rect x="3" y="3" width="12" height="8" rx="1" fill="url(#sfpCage)" stroke="#cbd5e1" stroke-width="0.5"/>
      <rect x="19" y="3" width="12" height="8" rx="1" fill="url(#sfpCage)" stroke="#cbd5e1" stroke-width="0.5"/>
      <!-- SFP 3 & 4 -->
      <rect x="3" y="13" width="12" height="8" rx="1" fill="url(#sfpCage)" stroke="#cbd5e1" stroke-width="0.5"/>
      <rect x="19" y="13" width="12" height="8" rx="1" fill="url(#sfpCage)" stroke="#cbd5e1" stroke-width="0.5"/>
      <!-- SFP Optics Active LEDs (10G Fiber Uplinks) -->
      <circle cx="9" cy="1" r="1" fill="#10b981"/>
      <circle cx="25" cy="1" r="1" fill="#10b981"/>
      <circle cx="9" cy="23" r="1" fill="#38bdf8"/>
      <circle cx="25" cy="23" r="1" fill="#64748b"/>
    </g>
  </g>
</svg>

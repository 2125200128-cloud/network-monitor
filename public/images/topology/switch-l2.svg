<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="switchL2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="switchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cisco Switch L2 Chassis Block -->
  <g filter="url(#switchGlow)">
    <!-- Main Box -->
    <rect x="6" y="8" width="88" height="64" rx="8" ry="8" fill="url(#switchL2Grad)" stroke="#60a5fa" stroke-width="2.5"/>

    <!-- Inner bezel border -->
    <rect x="10" y="12" width="80" height="56" rx="5" ry="5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Cisco 4 Switching Arrows (2 pointing left, 2 pointing right) -->
    <g fill="#ffffff">
      <!-- Upper Pair: Left-pointing arrow -->
      <path d="M 22 28 L 38 20 L 38 25 L 56 25 L 56 31 L 38 31 L 38 36 Z" opacity="0.95"/>
      <!-- Upper Pair: Right-pointing arrow -->
      <path d="M 78 28 L 62 20 L 62 25 L 44 25 L 44 31 L 62 31 L 62 36 Z" opacity="0.95"/>

      <!-- Lower Pair: Right-pointing arrow -->
      <path d="M 78 52 L 62 44 L 62 49 L 44 49 L 44 55 L 62 55 L 62 60 Z" opacity="0.95"/>
      <!-- Lower Pair: Left-pointing arrow -->
      <path d="M 22 52 L 38 44 L 38 49 L 56 49 L 56 55 L 38 55 L 38 60 Z" opacity="0.95"/>
    </g>

    <!-- Small decorative rack/LED indicators -->
    <circle cx="16" cy="18" r="2" fill="#10b981"/>
    <circle cx="23" cy="18" r="2" fill="#10b981"/>
    <circle cx="84" cy="18" r="2.2" fill="#38bdf8"/>
  </g>
</svg>

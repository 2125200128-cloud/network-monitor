<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="routerGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="routerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Router 3D/Cylinder Cisco Disc Base -->
  <g filter="url(#routerGlow)">
    <!-- Base circle -->
    <circle cx="50" cy="50" r="44" fill="url(#routerGrad)" stroke="url(#rimGrad)" stroke-width="3"/>
    
    <!-- Inner subtle ring -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Cisco 4-Arrow Routing Symbol -->
    <!-- Top-Left arrow pointing towards center -->
    <g fill="#ffffff">
      <!-- Arrow 1: Pointing In from Left-Top -->
      <path d="M 23 37 L 40 37 L 40 32 L 48 40 L 40 48 L 40 43 L 23 43 Z" opacity="0.95"/>
      <!-- Arrow 2: Pointing Out to Right-Top -->
      <path d="M 77 37 L 60 37 L 60 32 L 52 40 L 60 48 L 60 43 L 77 43 Z" transform="rotate(180 64.5 40)" opacity="0.95"/>
      <!-- Arrow 3: Top to bottom (in) -->
      <path d="M 43 23 L 43 40 L 48 40 L 40 48 L 32 40 L 37 40 L 37 23 Z" opacity="0.95"/>
      <!-- Arrow 4: Bottom to top (out) -->
      <path d="M 43 77 L 43 60 L 48 60 L 40 52 L 32 60 L 37 60 L 37 77 Z" opacity="0.95"/>
    </g>

    <!-- Center Hub Dot -->
    <circle cx="50" cy="50" r="4.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>

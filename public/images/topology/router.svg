<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Vibrant Cisco Yellow/Gold Radial Gradient -->
    <radialGradient id="ciscoYellowGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    
    <!-- Outer Golden Rim Gradient -->
    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#854d0e" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Deep Drop Shadow & Ambient Glow -->
    <filter id="yellowRouterShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ca8a04" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#yellowRouterShadow)">
    <!-- Base Outer Circle (Cisco Disc Chassis) -->
    <circle cx="60" cy="60" r="52" fill="url(#ciscoYellowGrad)" stroke="url(#goldRimGrad)" stroke-width="3.5"/>
    
    <!-- Inner Accent Ring -->
    <circle cx="60" cy="60" r="44" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Cisco 4-Arrow Dynamic Cross Matrix (White with subtle shadow) -->
    <g fill="#ffffff" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.35))">
      <!-- 1. Left Arrow (Pointing In to Center) -->
      <path d="M 24 56 L 44 56 L 44 50 L 53 60 L 44 70 L 44 64 L 24 64 Z"/>
      
      <!-- 2. Right Arrow (Pointing Out to Right) -->
      <path d="M 67 60 L 76 50 L 76 56 L 96 56 L 96 64 L 76 64 L 76 70 Z"/>
      
      <!-- 3. Top Arrow (Pointing In to Center) -->
      <path d="M 56 24 L 56 44 L 50 44 L 60 53 L 70 44 L 64 44 L 64 24 Z"/>
      
      <!-- 4. Bottom Arrow (Pointing Out to Bottom) -->
      <path d="M 60 67 L 50 76 L 56 76 L 56 96 L 64 96 L 64 76 L 70 76 Z"/>
      
      <!-- Center Routing Core Dot -->
      <circle cx="60" cy="60" r="4.5" fill="#ffffff"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="switchL3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Cisco Multilayer / Core Switch (L3) Block -->
  <g filter="url(#coreGlow)">
    <!-- Main Box with Core Gold Bezel -->
    <rect x="6" y="8" width="88" height="64" rx="10" ry="10" fill="url(#switchL3Grad)" stroke="url(#goldBorder)" stroke-width="3"/>

    <!-- Inner bezel border -->
    <rect x="10" y="12" width="80" height="56" rx="6" ry="6" fill="none" stroke="#fef3c7" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Cisco Multilayer 4-Way Routing/Switching Cross Arrows -->
    <g fill="#ffffff">
      <!-- Top Arrow pointing UP-OUT -->
      <path d="M 50 16 L 58 25 L 53 25 L 53 35 L 47 35 L 47 25 L 42 25 Z" opacity="0.95"/>
      <!-- Bottom Arrow pointing DOWN-OUT -->
      <path d="M 50 64 L 58 55 L 53 55 L 53 45 L 47 45 L 47 55 L 42 55 Z" opacity="0.95"/>
      <!-- Left Arrow pointing LEFT-IN -->
      <path d="M 36 40 L 27 32 L 27 37 L 17 37 L 17 43 L 27 43 L 27 48 Z" opacity="0.95"/>
      <!-- Right Arrow pointing RIGHT-IN -->
      <path d="M 64 40 L 73 32 L 73 37 L 83 37 L 83 43 L 73 43 L 73 48 Z" opacity="0.95"/>
    </g>

    <!-- Center Layer 3 Routing Node Diamond -->
    <polygon points="50,33 57,40 50,47 43,40" fill="#fbbf24" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Status LEDs for Core Switch -->
    <circle cx="16" cy="18" r="2.5" fill="#10b981"/>
    <circle cx="23" cy="18" r="2.5" fill="#fbbf24"/>
    <circle cx="84" cy="18" r="2.5" fill="#38bdf8"/>
  </g>
</svg>

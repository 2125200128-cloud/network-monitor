# Network Monitor NOC — sitio de Nginx (instalar.sh reemplaza @APP_DIR@, @DOMINIO@ y @PHP_SOCK@)
server {
    listen 80;
    listen [::]:80;
    server_name @DOMINIO@;
    # HTTPS: lo crea deploy/https.sh. Mientras no exista, el patrón no coincide con nada y solo se sirve http
    include /etc/nginx/snippets/network-monitor-tl[s].conf;

    root @APP_DIR@/public;
    index index.php;
    charset utf-8;

    # Avatares de usuarios
    client_max_body_size 10M;

    # El dashboard pesa ~3 MB de HTML: comprimido baja a ~200 KB (pantallas que refrescan cada 30 s)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Video de las cámaras (go2rtc, solo en 127.0.0.1:1984): se publica únicamente el reproductor y su WebSocket,
    # y solo a quien tenga sesión con rol para verlo (auth_request a Laravel). Su API de administración no sale.
    location ~ ^/go2rtc/(api/ws|video-stream\.js|video-rtc\.js)$ {
        auth_request /api/camaras/autorizar;
        proxy_pass http://127.0.0.1:1984;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location /go2rtc/ { return 404; }

    # Respuesta de Laravel para auth_request: 204 con sesión y rol, 401 sin ellos (la cookie viaja en los encabezados)
    location = /api/camaras/autorizar {
        fastcgi_pass unix:@PHP_SOCK@;
        fastcgi_pass_request_body off;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/camaras/autorizar;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param QUERY_STRING "";
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Módulos JS (.mjs): el mime.types de Nginx no los conoce y los manda como octet-stream; el navegador se
    # niega a ejecutar un módulo así y no carga el reproductor Lottie (huella del login, carga de Topología).
    # Va antes que la de abajo: de las ubicaciones con expresión regular gana la primera que coincide.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Recursos compilados por Vite e imágenes: caché larga (llevan versión en el nombre)
    location ~* ^/(build|images|vendor)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:@PHP_SOCK@;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # Reportes PDF, exportaciones y descubrimiento de red
        fastcgi_read_timeout 180;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # Nada fuera de public/ ni archivos ocultos (.env, .git)
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
